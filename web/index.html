<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Marks the app shell; ChartFrame uses it to detect a missing chart folder. -->
    <meta name="refuge-app" />
    <title>Refuge</title>
    <meta name="description" content="Send a tornado or hurricane through a real town. See who is at risk and why, turn existing buildings into shelters, then replay the storm." />
    <meta name="theme-color" content="#232E43" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews. %SITE_URL% is filled in at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Refuge" />
    <meta property="og:title" content="Refuge" />
    <meta property="og:description" content="Send a storm through a real town. See who is at risk. Plan shelters that save lives." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Refuge: a storm path drawn as a heat map of risk over a town" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Refuge" />
    <meta name="twitter:description" content="Send a storm through a real town. See who is at risk. Plan shelters that save lives." />
    <meta name="twitter:image" content="%SITE_URL%/og-card.png" />

    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
