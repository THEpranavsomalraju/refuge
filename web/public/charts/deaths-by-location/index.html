<!doctype html>
<!-- Sample chart: where tornado deaths happen, night vs day. Data: /data/deaths_by_location.json (ml/exports).
     Shares exclude unknown locations. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/brand.css" />
  <style>
    body { margin: 0; background: transparent; font-size: 12px; }
    .legend { display: flex; gap: 16px; margin-bottom: 10px; color: var(--fg-muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    .row { display: grid; grid-template-columns: 110px 1fr 48px; align-items: center; gap: 10px; margin: 6px 0; }
    .name { color: var(--fg-muted); }
    .bars { display: grid; gap: 3px; }
    .bar { height: 9px; border-radius: 2px; min-width: 2px; }
    .night { background: var(--violet); }
    .day { background: var(--cyan); }
    .pct { text-align: right; }
  </style>
</head>
<body>
  <div class="legend"><span><i class="night"></i>Night</span><span><i class="day"></i>Day</span></div>
  <div id="chart"></div>

  <script>
    const NAMES = { MH: 'Mobile home', RES: 'House', PUBLIC: 'Public bldg', VEHICLE: 'Vehicle', OUTDOOR: 'Outdoors', WATER: 'Water', OTHER: 'Other' };
    fetch('/data/deaths_by_location.json').then(r => r.json()).then(d => {
      const t = d.by_event_type.Tornado;
      const classes = Object.keys(t.shares).sort((a, b) => t.shares[b] - t.shares[a]).filter(c => t.shares[c] >= 0.005);
      const max = Math.max(...classes.flatMap(c => [t.shares_night[c], t.shares_day[c]]));
      document.getElementById('chart').innerHTML = classes.map(c => `
        <div class="row" title="Night ${(t.shares_night[c] * 100).toFixed(1)}% · Day ${(t.shares_day[c] * 100).toFixed(1)}%">
          <span class="name">${NAMES[c] ?? c}</span>
          <span class="bars">
            <span class="bar night" style="width:${(t.shares_night[c] / max) * 100}%"></span>
            <span class="bar day" style="width:${(t.shares_day[c] / max) * 100}%"></span>
          </span>
          <span class="pct">${Math.round(t.shares[c] * 100)}%</span>
        </div>`).join('');
    });
  </script>

  <script>
    new ResizeObserver(() => parent.postMessage({ type: 'refuge:height', height: document.body.getBoundingClientRect().height }, '*'))
      .observe(document.body);
  </script>
</body>
</html>
